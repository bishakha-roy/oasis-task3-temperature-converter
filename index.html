<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="converter-container">

        <div class="converter-card">

            <h1>Temperature Converter</h1>
            <p class="subtitle">Convert temperature between Celsius, Fahrenheit and Kelvin</p>

            <div class="input-group">
                <label for="temperature">Enter Temperature</label>
                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter a value"
                    step="any"
                >
            </div>

            <div class="input-group">
                <label for="unit">Select Unit</label>
                <select id="unit">
                    <option value="C">Celsius (°C)</option>
                    <option value="F">Fahrenheit (°F)</option>
                    <option value="K">Kelvin (K)</option>
                </select>
            </div>

            <button id="convertBtn">Convert Temperature</button>

            <p id="errorMessage" class="error-message"></p>

            <div class="results">
                <h2>Converted Temperature</h2>

                <div class="result-box">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-box">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-box">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
